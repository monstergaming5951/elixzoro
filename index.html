<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELIXZORO | Loyalty Club</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#d4b16a;--bg:#101010;--panel:#191919;--line:#35332d;--text:#f6f4ef;--muted:#aaa79f;--green:#9ad2a5;--red:#ff9e9e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,system-ui,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:20px clamp(16px,5vw,60px);border-bottom:1px solid var(--line);flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.15em}.brand small{display:block;color:var(--gold);font-size:10px;margin-top:5px}
nav{display:flex;gap:8px;flex-wrap:wrap}main{max-width:1050px;margin:auto;padding:35px 18px 60px}h1{font-size:clamp(32px,6vw,54px);letter-spacing:-.05em;margin:12px 0}h2{font-size:17px}p{line-height:1.65}.muted{color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--gold);font-weight:800}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:22px;margin-bottom:18px;min-width:0}.hero{margin-bottom:25px}.card{border:1px solid #55472d;border-radius:14px;padding:22px;background:radial-gradient(ellipse at top right,#3a3020,transparent 65%),#151515}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:26px 0}.stamp{aspect-ratio:1;border:1px dashed #605a4d;border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:20px}.stamp small{font-size:8px;display:block}.stamp.done{background:var(--gold);border:1px solid var(--gold);color:#15120c}
.progress{height:6px;background:#38352e;border-radius:20px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:var(--gold)}.btn{border:1px solid var(--gold);background:var(--gold);color:#17130a;border-radius:7px;padding:11px 15px;font-weight:800;font-size:12px}.btn.secondary,nav button{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:10px 12px}nav button.active{border-color:var(--gold);color:var(--gold)}
input,select{width:100%;padding:12px;background:#101010;color:white;border:1px solid var(--line);border-radius:7px;margin:7px 0 14px}label{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row:last-child{border-bottom:0}.badge{font-size:11px;border:1px solid #4b493e;padding:6px 9px;border-radius:30px}.notice{padding:12px;border:1px solid #51452e;color:#e3d1a3;border-radius:8px;font-size:12px;line-height:1.6;margin:15px 0}.error{color:var(--red);font-size:13px;white-space:pre-wrap}.success{color:var(--green);font-size:13px}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap}.customer{border-bottom:1px solid var(--line);padding:14px 0}footer{padding:25px;text-align:center;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
@media(max-width:700px){.grid{grid-template-columns:1fr}header{align-items:flex-start}.stamps{gap:6px}.stamp{font-size:17px}.panel{padding:17px}}
</style></head>
<body>
<header><div class="brand">ELIXZORO<small>WEAR LEGACY · LOYALTY CLUB</small></div>
<nav id="nav" class="hidden"><button data-page="card" class="active">MY CARD</button><button data-page="history">HISTORY</button><button data-page="admin" id="adminTab" class="hidden">ADMIN</button><button id="logout">LOG OUT</button></nav></header>
<main>
<section id="auth"><div class="hero"><div class="eyebrow">YOUR LOYALTY. YOUR LEGACY.</div><h1>Every jersey<br>gets you closer.</h1><p class="muted">Collect 10 verified stamps and earn a free jersey.</p></div>
<div class="panel"><h2 id="authTitle">Join Elixzoro Loyalty Club</h2><p class="muted" id="authDescription">Create your customer account.</p>
<form id="authForm"><div id="nameField"><label for="fullName">FULL NAME</label><input id="fullName" autocomplete="name" maxlength="100" required><label for="phone">PHONE (OPTIONAL)</label><input id="phone" autocomplete="tel" maxlength="20"></div>
<label for="email">EMAIL ADDRESS</label><input id="email" type="email" autocomplete="email" required><label for="password">PASSWORD</label><input id="password" type="password" minlength="6" autocomplete="new-password" required><button class="btn" id="authSubmit" type="submit">CREATE ACCOUNT</button></form>
<p><button id="toggleAuth" type="button" class="btn secondary">Already registered? Log in</button></p><p id="authMessage" role="status"></p></div></section>
<section id="app" class="hidden"><div id="content"></div><p id="message" role="status"></p></section></main><footer>ELIXZORO® · WEAR LEGACY.</footer>
<script>
(()=>{"use strict";
const SUPABASE_URL="https://arnbkbogdpgpbjtinbcv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_V3HIo_sXnnrZ0zOBS8Jceg_RiHhZQOi0";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);let user=null,profile=null,page="card",isLogin=false,sessionStartToken=0;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function say(t,e=false){$("message").className=e?"error":"success";$("message").textContent=t}
function authSay(t,e=false){$("authMessage").className=e?"error":"success";$("authMessage").textContent=t}
function date(v){return v?new Date(v).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"—"}
function showSignedOut(){user=null;profile=null;$("auth").classList.remove("hidden");$("app").classList.add("hidden");$("nav").classList.add("hidden")}
function adminAllowed(){return profile?.role==="admin"}
async function loadProfile(){
 let {data,error}=await db.from("profiles").select("id,full_name,phone,role,is_admin").eq("id",user.id).maybeSingle();if(error)throw error;
 if(!data){const meta=user.user_metadata||{};const setup=await db.rpc("setup_my_profile",{p_full_name:meta.full_name||"Member",p_phone:meta.phone||null});if(setup.error)throw setup.error;
 ({data,error}=await db.from("profiles").select("id,full_name,phone,role,is_admin").eq("id",user.id).maybeSingle());if(error)throw error}
 if(!data)throw new Error("Your profile is not ready yet. Confirm your email and log in again, or ask the shop admin to check your profile.");
 profile=data;$("adminTab").classList.toggle("hidden",!adminAllowed())
}
async function startSession(sessionUser){const token=++sessionStartToken;user=sessionUser;if(!user){showSignedOut();return}
 $("auth").classList.add("hidden");$("app").classList.remove("hidden");$("nav").classList.remove("hidden");
 try{await loadProfile();if(token!==sessionStartToken)return;await render()}catch(e){console.error(e);say(e.message||"Could not load your account.",true)}}
function setAuthMode(login){isLogin=login;$("nameField").classList.toggle("hidden",login);$("fullName").required=!login;$("authTitle").textContent=login?"Welcome back":"Join Elixzoro Loyalty Club";$("authDescription").textContent=login?"Log in to view your loyalty card.":"Create your customer account.";$("authSubmit").textContent=login?"LOG IN":"CREATE ACCOUNT";$("toggleAuth").textContent=login?"New here? Create an account":"Already registered? Log in";$("password").autocomplete=login?"current-password":"new-password";authSay("")}
$("toggleAuth").onclick=()=>setAuthMode(!isLogin);
$("authForm").onsubmit=async ev=>{ev.preventDefault();$("authSubmit").disabled=true;authSay("Please wait…");const email=$("email").value.trim(),password=$("password").value;
 try{if(isLogin){const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await startSession(data.user)}
 else{const fullName=$("fullName").value.trim(),phone=$("phone").value.trim();if(!fullName)throw new Error("Please enter your full name.");
 const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:fullName,phone:phone||null}}});if(error)throw error;
 if(data.session){const {error:se}=await db.rpc("setup_my_profile",{p_full_name:fullName,p_phone:phone||null});if(se)throw se;await startSession(data.user)}
 else{setAuthMode(true);$("authTitle").textContent="Check your email";$("authDescription").textContent="Confirm your email, then log in.";authSay("Account created. Check your email for the confirmation link. After confirming, log in.")}}
 }catch(e){authSay(e.message||"Authentication failed.",true)}finally{$("authSubmit").disabled=false}};
$("logout").onclick=async()=>{const {error}=await db.auth.signOut();if(error)return say(error.message,true);showSignedOut()};
$("nav").querySelectorAll("[data-page]").forEach(b=>b.onclick=async()=>{if(b.dataset.page==="admin"&&!adminAllowed())return say("Admin access required.",true);page=b.dataset.page;$("nav").querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x===b));try{await render()}catch(e){console.error(e);say(e.message||"Could not load this page.",true)}});
async function getCard(id=user.id){const {data,error}=await db.from("loyalty_cards").select("user_id,stamps,season,updated_at").eq("user_id",id).maybeSingle();if(error)throw error;return data||{user_id:id,stamps:0,season:1}}
async function render(){if(!user||!profile)return;$("message").textContent="";if(page==="admin")return renderAdmin();if(page==="history")return renderHistory();return renderCard()}
async function renderCard(){
 const [card,p,r]=await Promise.all([getCard(),db.from("purchases").select("id,receipt_ref,season_id,stamp_number,created_at").eq("user_id",user.id).order("created_at",{ascending:false}).limit(10),db.from("rewards").select("id,season_id,status,redeemed_at,created_at").eq("user_id",user.id).order("created_at",{ascending:false})]);
 if(p.error)throw p.error;if(r.error)throw r.error;const n=Math.max(0,Math.min(10,Number(card.stamps)||0)),rewards=r.data||[],season=Number(card.season)||1;
 $("content").innerHTML=`<div class="hero"><div class="eyebrow">ELIXZORO MEMBER</div><h1>Welcome back,<br>${esc((profile.full_name||"Member").trim().split(/\s+/)[0])}.</h1><p class="muted">Your loyalty journey continues here.</p></div>
 <div class="grid"><section class="panel"><div class="eyebrow">YOUR DIGITAL STAMP CARD</div><h2>SEASON ${String(season).padStart(2,"0")}</h2><p class="muted">10 verified jersey purchases = 1 free jersey.</p><div class="card"><div class="stamps">${Array.from({length:10},(_,i)=>`<div class="stamp ${i<n?"done":""}"><div>${i<n?"✓":i+1}<small>${i<n?"EARNED":"STAMP"}</small></div></div>`).join("")}</div><strong>${n}/10 stamps collected</strong><div class="progress"><div style="width:${n*10}%"></div></div><p class="muted">${Math.max(0,10-n)} more to your free jersey.</p></div>
 <h2>Recent purchases</h2>${p.data?.length?p.data.map(x=>`<div class="row"><div><strong>Stamp ${x.stamp_number}</strong><div class="muted">${esc(x.receipt_ref)} · ${date(x.created_at)}</div></div><span class="badge">VERIFIED</span></div>`).join(""):`<p class="muted">Your verified purchases will appear here.</p>`}</section>
 <aside><div class="panel"><div class="eyebrow">YOUR REWARDS</div><h2>${rewards.filter(x=>x.status==="unlocked").length} available reward(s)</h2>${rewards.length?rewards.map(x=>`<div class="row"><div><strong>Reward</strong><div class="muted">Created ${date(x.created_at)}${x.redeemed_at?" · Redeemed "+date(x.redeemed_at):""}</div></div><span class="badge">${esc(String(x.status||"").toUpperCase())}</span></div>`).join(""):`<p class="muted">Complete a season to unlock a reward.</p>`}</div><div class="notice">🔒 Stamps can only be awarded by an authorised Elixzoro admin after a purchase is verified.</div></aside></div>`
}
async function renderHistory(){const [p,r]=await Promise.all([db.from("purchases").select("id,receipt_ref,season_id,stamp_number,created_at").eq("user_id",user.id).order("created_at",{ascending:false}),db.from("rewards").select("id,season_id,status,redeemed_at,created_at").eq("user_id",user.id).order("created_at",{ascending:false})]);if(p.error)throw p.error;if(r.error)throw r.error;
 $("content").innerHTML=`<div class="hero"><div class="eyebrow">YOUR LOYALTY JOURNEY</div><h1>History.</h1><p class="muted">Your verified purchases and rewards.</p></div><div class="panel"><h2>PURCHASES</h2>${p.data?.length?p.data.map(x=>`<div class="row"><div><strong>Stamp ${x.stamp_number}</strong><div class="muted">${esc(x.receipt_ref)} · ${date(x.created_at)}</div></div><span class="badge">VERIFIED</span></div>`).join(""):`<p class="muted">No purchases yet.</p>`}<h2>REWARDS</h2>${r.data?.length?r.data.map(x=>`<div class="row"><div><strong>Reward</strong><div class="muted">Created ${date(x.created_at)}${x.redeemed_at?" · Redeemed "+date(x.redeemed_at):""}</div></div><span class="badge">${esc(String(x.status||"").toUpperCase())}</span></div>`).join(""):`<p class="muted">No rewards yet.</p>`}</div>`}
async function renderAdmin(){if(!adminAllowed())throw new Error("Admin access required.");
 const [pr,cr,rr]=await Promise.all([db.from("profiles").select("id,full_name,phone,role,is_admin,created_at").order("created_at"),db.from("loyalty_cards").select("user_id,stamps,season"),db.from("rewards").select("id,user_id,season_id,status,redeemed_at,created_at").order("created_at",{ascending:false})]);if(pr.error)throw pr.error;if(cr.error)throw cr.error;if(rr.error)throw rr.error;
 const profiles=pr.data||[],cards=Object.fromEntries((cr.data||[]).map(c=>[c.user_id,c])),rewards=rr.data||[];
 $("content").innerHTML=`<div class="hero"><div class="eyebrow">OWNER CONTROL CENTRE</div><h1>Admin console.</h1><p class="muted">Manage members, award stamps and redeem rewards.</p></div><div class="notice">Confirm the real purchase before awarding a stamp. Receipt references can only be used once.</div>
 <div class="grid"><section class="panel"><h2>AWARD A STAMP</h2><label for="customerSelect">SELECT CUSTOMER</label><select id="customerSelect">${profiles.filter(p=>p.id!==user.id&&p.role!=="admin").map(p=>`<option value="${p.id}">${esc(p.full_name||"Unnamed customer")} · ${esc(p.id.slice(0,8))}</option>`).join("")}</select><label for="receipt">PURCHASE / RECEIPT REFERENCE</label><input id="receipt" maxlength="80" placeholder="e.g. ELX-2026-001"><button id="awardBtn" class="btn">+ AWARD STAMP</button><p id="adminMessage" role="status"></p></section>
 <section class="panel"><h2>CUSTOMER DATABASE</h2><input id="customerSearch" placeholder="Search name, phone, ID…"><div id="customerList"></div></section></div><section class="panel"><h2>REWARD REDEMPTION</h2><div id="rewardList"></div></section>`;
 function drawCustomers(filter=""){$("customerList").innerHTML=profiles.filter(p=>((p.full_name||"")+" "+(p.phone||"")+" "+p.id).toLowerCase().includes(filter.toLowerCase())).map(p=>{const c=cards[p.id]||{stamps:0,season:1};return `<div class="customer"><strong>${esc(p.full_name||"Unnamed customer")}${p.id===user.id?" (You)":""}</strong><div class="muted">${esc(p.phone||"No phone")} · Season ${Number(c.season)||1} · ${Number(c.stamps)||0}/10 stamps</div></div>`}).join("")||`<p class="muted">No matching customers.</p>`}
 drawCustomers();$("customerSearch").oninput=e=>drawCustomers(e.target.value);
 $("awardBtn").onclick=async()=>{const customerId=$("customerSelect").value,receipt=$("receipt").value.trim();if(!customerId)return adminSay("No customer account found to award.",true);if(!receipt)return adminSay("Enter the receipt reference.",true);$("awardBtn").disabled=true;
 try{const {data,error}=await db.rpc("award_stamp",{p_customer_id:customerId,p_receipt:receipt});if(error)throw error;if(data?.success===false)throw new Error(data.message||data.error||"The stamp could not be awarded.");const stamp=Number(data?.stamp_number)||0,unlocked=Boolean(data?.reward_unlocked);adminSay(unlocked?"Stamp awarded! Season complete — free jersey reward unlocked.":`Stamp ${stamp}/10 awarded successfully.`);await renderAdmin()}catch(e){adminSay(e.message||"Could not award stamp.",true)}finally{const b=$("awardBtn");if(b)b.disabled=false}};
 $("rewardList").innerHTML=rewards.length?rewards.map(r=>{const name=profiles.find(p=>p.id===r.user_id)?.full_name||"Customer";return `<div class="row"><div><strong>${esc(name)} · Reward</strong><div class="muted">Created ${date(r.created_at)}${r.redeemed_at?" · Redeemed "+date(r.redeemed_at):""}</div></div><div class="actions"><span class="badge">${esc(String(r.status||"").toUpperCase())}</span>${r.status==="unlocked"?`<button class="btn" data-redeem="${r.id}">REDEEM</button>`:""}</div></div>`}).join(""):`<p class="muted">No rewards yet.</p>`;
 $("rewardList").querySelectorAll("[data-redeem]").forEach(b=>b.onclick=async()=>{if(!confirm("Confirm the free jersey has been handed to this customer?"))return;b.disabled=true;try{const {error}=await db.rpc("redeem_reward",{p_reward_id:b.dataset.redeem});if(error)throw error;adminSay("Reward marked as redeemed.");await renderAdmin()}catch(e){adminSay(e.message||"Could not redeem reward.",true);b.disabled=false}})
}
function adminSay(t,e=false){const el=$("adminMessage");if(el){el.className=e?"error":"success";el.textContent=t}else say(t,e)}
db.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){sessionStartToken++;showSignedOut();return}if(session?.user&&event==="SIGNED_IN")setTimeout(()=>startSession(session.user),0)});
db.auth.getSession().then(({data,error})=>{if(error)return authSay(error.message,true);if(data.session)startSession(data.session.user);else showSignedOut()}).catch(e=>authSay(e.message,true));
})();
</script></body></html>
